public_summary: >-
  Le 22 novembre 2026, demande à l'AUE des conditions d'éligibilité,
  justificatifs immobiliers et techniques, règlements, annexes,
  cahiers des charges et instructions applicables au dispositif ORELI
  pour la rénovation énergétique du seul deuxième étage du château Mariani
  à Minesteggio (Corte), destiné à devenir la résidence principale du demandeur.
  Le bâtiment est partiellement inscrit MH (façades et toitures, non les intérieurs).
  L'étage comporte environ 80 m² au total, dont 70 m² habitables, peu isolés.
  Demande explicite de communication électronique de documents administratifs
  au titre des articles L. 311-1 et suivants du CRPA, sans mention d'un
  différend avec un opérateur local.
