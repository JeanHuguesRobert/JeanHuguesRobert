    channel: "email (Gmail)"
    event: "Première tentative de transmission du dossier et demande de rendez-vous"
    summary: >
      Gmail a accepté le message côté expéditeur avec neuf pièces jointes, dont le guide DITP.
      Le serveur destinataire de la préfecture a ensuite refusé la livraison en raison de la taille
      totale du message.
