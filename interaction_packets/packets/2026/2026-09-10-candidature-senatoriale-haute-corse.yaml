contexte: >
  Pré-transmission dématérialisée du dossier de candidature afin de permettre son contrôle
  avant le rendez-vous de dépôt. Un rendez-vous est demandé pour la matinée du vendredi
  11 septembre 2026. Le candidat indique venir de Corte à Bastia en train et avoir organisé
  son retour en covoiturage avec départ de Bastia à 13 h, en rattachant mobilité collective
  et transmission numérique à une même démarche concrète de décarbonation.

