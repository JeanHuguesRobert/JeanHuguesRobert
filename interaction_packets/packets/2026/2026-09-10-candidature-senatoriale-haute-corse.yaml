contexte: >
  Pré-transmission dématérialisée du dossier de candidature afin de permettre son contrôle
  avant le rendez-vous de dépôt. Un rendez-vous est demandé pour la matinée du vendredi
  11 septembre 2026. Le candidat indique venir de Corte à Bastia en train et avoir organisé
  son retour en covoiturage avec départ de Bastia à 13 h, en rattachant mobilité collective
  et transmission numérique à une même démarche concrète de décarbonation.

timeline:
  - date: "2026-09-10"
    time: "17:01"
    direction: "outbound"
    channel: "email (Gmail)"
    event: "Première tentative de transmission du dossier et demande de rendez-vous"
    summary: >
      Gmail a accepté le message côté expéditeur avec neuf pièces jointes. Le serveur destinataire
      de la préfecture a ensuite refusé la livraison en raison de la taille totale du message.
    status: "delivery_failed"
  - date: "2026-09-10"
    time: "17:02-17:04"
    direction: "inbound"
    channel: "email (Gmail)"
    event: "Notifications d'échec de livraison"
    summary: >
      Trois notifications du Mail Delivery Subsystem ont été reçues dans le même fil. Motif explicite :
      « Message too large » ; réponse du serveur distant : « 552 5.3.4 Message size exceeds fixed limit ».
      La préfecture n'a donc pas reçu le premier dossier.
    status: "received"
  - date: "2026-09-10"
    direction: "internal"
    channel: "Gmail draft"
    event: "Préparation d'une retransmission allégée"
    summary: >
      Le PDF contenant l'acceptation manuscrite et la CNI de Marguerite Ghionga a été recompressé
      de 9,2 MiB à environ 614 KiB. Le guide DITP « Objectif zéro papier : simplifier » a été retiré
      des pièces jointes et remplacé par son lien officiel. Un brouillon de réponse a été créé dans
      le même fil Gmail, avec Laurence et Maguy à nouveau en copie.
    status: "prepared"
  - date: "2026-09-10"
    direction: "internal"
    channel: "Google Drive + GitHub"
    event: "Traitement privacy avant publication des pièces"
    summary: >
      Le principal a relevé qu'une publication brute des pièces créerait un problème de privacy.
      Les huit originaux exacts destinés à la préfecture ont donc été archivés dans un dossier Drive
      privé. Une projection publique distincte a été produite après expurgation des identifiants et
      moyens d'authentification réutilisables ainsi que des coordonnées privées de tiers.
    status: "privacy_redaction_prepared"
  - date: "2026-09-10"
    time: "17:54:50"
    direction: "outbound"
    channel: "email (Gmail)"
    event: "Retransmission allégée du dossier"
    summary: >
      Le dossier a été retransmis au bureau des élections avec huit pièces jointes, le guide DITP
      étant désormais référencé par URL. Laurence Marie Vernerey et Marguerite Ghionga sont à nouveau en copie.
    status: "sent"
  - date: "2026-09-10"
    time: "17:56:53"
    direction: "inbound"
    channel: "email automatique — Préfecture de la Haute-Corse"
    event: "Accusé de réception électronique de la préfecture"
    summary: >
      Le bureau des élections confirme que le candidat l'a « saisi par voie électronique » et que
      « le présent accusé de réception atteste de la réception de votre saisine ». L'accusé précise
      expressément que cette réception ne préjuge pas de la complétude ni de la recevabilité et que
      des informations ou pièces complémentaires seront demandées si l'instruction les nécessite.
    status: "received_and_acknowledged"
  - date: "2026-09-10"
    time: "20:05"
    direction: "inbound"
    channel: "email (Gmail)"
    event: "Réponse nominative du bureau des élections sur le CERFA de la remplaçante"
    summary: >
      Le bureau indique que le CERFA de la remplaçante n'est pas considéré recevable par voie
      dématérialisée pour le dépôt ; il invoque les art. L.298 et L.299, le mémento et la notice
      CERFA, demande la mention de consentement et une « signature manuscrite originale », et
      indique qu'à défaut la candidature peut être déférée au TA dans les 24 h. L'objection est
      formulée avant le déplacement, ce qui permet une discussion contradictoire.
    source: "interaction_packets/mail_trace.md (mise à jour 2026-09-11)"
    status: "received"
  - date: "2026-09-10"
    direction: "inbound"
    channel: "email (copie)"
    event: "Accusé informel de Laurence (remplaçante) sur la démarche électronique"
    summary: >
      Laurence, destinataire en copie, répond « Tu as bien fait de leur écrire » — trace de sa
      connaissance et de son approbation de la démarche électronique.
    source: "interaction_packets/mail_trace.md"
    status: "received"
  - date: "2026-09-11"
    time: "08:14"
    timezone: "Europe/Paris"
    direction: "outbound"
    channel: "email (Gmail)"
    event: "Annonce du déplacement Corte–Bastia pour présentation à la préfecture"
    summary: >
      Réponse du candidat dans le même fil, avec Laurence et Marguerite Ghionga en copie :
      départ de Corte en train à 09:45, arrivée Bastia 11:39, présentation à la préfecture peu
      après l'arrivée — plusieurs heures avant l'échéance de 18:00. Le point litigieux restant
      est l'exigence d'original matériel concernant le consentement de la remplaçante.
    source: "interaction_packets/mail_trace.md"
    status: "sent"
  - date: "2026-09-17"
    direction: "internal"
    channel: "Agent JHN interaction desk (SQL projection)"
    event: "Dogfood Reality check — réconciliation YAML ↔ mail_trace"
    summary: >
      Le desk SQL (Inseme #77) montrait encore next_watch « Confirmation du rendez-vous le 11
      septembre ». Inspection de mail_trace : la chronologie 10/09 20:05 → 11/09 08:14 était déjà
      enregistrée dans le registre Markdown mais absente de ce paquet YAML. Mise à jour du paquet
      sans prétendre clôturer les suites contentieuses (voir linked_cases 2026-09-16-*).
    status: "observed"
    act_ref: "act:inseme-77-dogfood-followup"

