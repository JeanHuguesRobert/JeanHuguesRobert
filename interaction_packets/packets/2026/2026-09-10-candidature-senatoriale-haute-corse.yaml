contexte: >
  Pré-transmission dématérialisée du dossier de candidature afin de permettre son contrôle
  avant le rendez-vous de dépôt. Un rendez-vous est demandé pour la matinée du vendredi
  11 septembre 2026. Le candidat indique venir de Corte à Bastia en train et avoir organisé
  son retour en covoiturage avec départ de Bastia à 13 h, en rattachant mobilité collective
  et transmission numérique à une même démarche concrète de décarbonation.

timeline:
  - date: "2026-09-10"
    time: "17:01"
    direction: "outbound"
    channel: "email (Gmail)"
    event: "Première tentative de transmission du dossier et demande de rendez-vous"
    summary: >
      Gmail a accepté le message côté expéditeur avec neuf pièces jointes. Le serveur destinataire
      de la préfecture a ensuite refusé la livraison en raison de la taille totale du message.
    status: "delivery_failed"
  - date: "2026-09-10"
    time: "17:02-17:04"
    direction: "inbound"
    channel: "email (Gmail)"
    event: "Notifications d'échec de livraison"
    summary: >
      Trois notifications du Mail Delivery Subsystem ont été reçues dans le même fil. Motif explicite :
      « Message too large » ; réponse du serveur distant : « 552 5.3.4 Message size exceeds fixed limit ».
      La préfecture n'a donc pas reçu le premier dossier.
    status: "received"
  - date: "2026-09-10"
    direction: "internal"
    channel: "Gmail draft"
    event: "Préparation d'une retransmission allégée"
    summary: >
      Le PDF contenant l'acceptation manuscrite et la CNI de Marguerite Ghionga a été recompressé
      de 9,2 MiB à environ 614 KiB. Le guide DITP « Objectif zéro papier : simplifier » a été retiré
      des pièces jointes et remplacé par son lien officiel. Un brouillon de réponse a été créé dans
      le même fil Gmail, avec Laurence et Maguy à nouveau en copie.
    status: "draft_ready"
  - date: "2026-09-10"
    direction: "internal"
    channel: "Google Drive + GitHub"
    event: "Traitement privacy avant publication des pièces"
    summary: >
      Le principal a relevé qu'une publication brute des pièces créerait un problème de privacy.
      Les huit originaux exacts destinés à la préfecture ont donc été archivés dans un dossier Drive
      privé. Une projection publique distincte a été produite après expurgation des identifiants et
      moyens d'authentification réutilisables ainsi que des coordonnées privées de tiers.
    status: "privacy_redaction_prepared"

