process_observation:
  type: "revealing_observation"
  label: "Limite de canal puis récupération numérique réussie"
  factual_basis_negative: >
    Le premier envoi a rencontré une limite fixe de taille du serveur destinataire et a été rejeté
    avec le code SMTP 552 5.3.4.
  principal_interpretation_negative: >
    Jean Hugues Robert qualifie cette friction de manifestation de « La Machine à Empêcher ».
    Cette qualification reste explicitement une interprétation, distincte du fait technique établi.
  factual_basis_positive: >
    Après adaptation, la retransmission allégée a été acceptée et la préfecture a envoyé en environ
    deux minutes un accusé automatique qui qualifie la démarche de saisine par voie électronique et
    atteste explicitement sa réception.
  assessment_positive: >
    Ce mécanisme automatique constitue un point favorable au fonctionnement administratif : il fournit
    rapidement une preuve de réception, distingue réception et recevabilité, et annonce le processus de
    demande de compléments éventuels.
  methodological_rule: >
    Ne pas instruire à charge. Enregistrer avec le même niveau de précision les frictions, les corrections,
    les réponses favorables et les éléments qui contredisent ou nuancent l'hypothèse critique initiale.
    La transparence recherchée est probatoire : faits datés, sources identifiables, interprétations séparées.

current_status:
  label: "Objection CERFA du 10/09 20:05 puis déplacement Bastia annoncé le 11/09 08:14 — suites dans 2026-09-16-*"
  interpretation: >
    Après l'accusé électronique automatique, le bureau a objecté le même soir à la recevabilité
    dématérialisée du CERFA de la remplaçante et a annoncé un risque de déféré TA. Le candidat a
    répondu le 11/09 matin en annonçant son arrivée à Bastia avant 18:00. Le registre mail_trace
    (mis à jour le 11/09 puis le 16/09) est en avance sur ce paquet YAML : des interactions
    ultérieures (rectification fichier national, TA Bastia, relance vidéo 17:57, commission de
    propagande) portent des IDs 2026-09-16-* encore sans paquet YAML dédié. Ce paquet documente
    la phase pré-transmission + bascule vers le dépôt physique ; il ne clôt pas le contentieux.

