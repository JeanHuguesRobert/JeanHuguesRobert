process_observation:
  type: "revealing_observation"
  label: "Limite de canal / Machine à Empêcher"
  factual_basis: >
    L'obstacle observé est une limite fixe de taille imposée par le serveur de messagerie du destinataire.
    Elle a empêché la livraison d'un dossier pourtant accepté par Gmail côté expéditeur.
  principal_interpretation: >
    Jean Hugues Robert qualifie cet épisode de nouvelle manifestation de « La Machine à Empêcher ».
    Cette qualification est enregistrée comme interprétation du principal ; le fait vérifiable reste
    le rejet SMTP 552 5.3.4 pour dépassement de taille.
  adaptation: >
    Réduire la friction : compression du seul PDF volumineux, remplacement de l'annexe documentaire
    binaire par son URL officielle, conservation du même canal et préparation d'un secours Drive.

current_status:
  label: "Première transmission rejetée ; retransmission allégée prête ; secours Drive privé + miroir expurgé préparés"
  interpretation: >
    La préfecture n'a pas reçu le premier dossier. Le nouveau brouillon Gmail conserve les huit pièces
    de candidature et pèse environ 3,2 MiB avant encodage. Les originaux ont été archivés sur Drive privé.
    Un miroir expurgé est prêt mais n'est pas encore ouvert au public faute de permission « anyone with link »
    exposée par le connecteur actuel.

