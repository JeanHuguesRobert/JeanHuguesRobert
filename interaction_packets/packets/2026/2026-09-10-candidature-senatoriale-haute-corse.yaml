  - date: "2026-09-10"
    time: "17:02-17:04"
    direction: "inbound"
    channel: "email (Gmail)"
    event: "Notifications d'échec de livraison"
    summary: >
      Trois notifications du Mail Delivery Subsystem ont été reçues dans le même fil. Motif explicite :
      « Message too large » ; réponse du serveur distant : « 552 5.3.4 Message size exceeds fixed limit ».
      La préfecture n'a donc pas reçu le premier dossier.
    status: "received"
  - date: "2026-09-10"
    direction: "internal"
    channel: "Gmail draft"
    event: "Préparation d'une retransmission allégée"
    summary: >
      Le PDF contenant l'acceptation manuscrite et la CNI de Marguerite Ghionga a été recompressé
      de 9,2 MiB à environ 614 KiB, sans modification visible du contenu utile. Le guide DITP
      « Objectif zéro papier : simplifier » a été retiré des pièces jointes et remplacé par son lien officiel.
      Un brouillon de réponse a été créé dans le même fil Gmail, avec Laurence et Maguy à nouveau en copie.
    status: "draft_ready"

