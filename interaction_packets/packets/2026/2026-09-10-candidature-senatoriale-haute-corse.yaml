process_observation:
  type: "revealing_observation"
  label: "Limite de canal / Machine à Empêcher"
  factual_basis: >
    L'obstacle observé est une limite fixe de taille imposée par le serveur de messagerie du destinataire.
    Elle a empêché la livraison d'un dossier pourtant accepté par Gmail côté expéditeur.
  principal_interpretation: >
    Jean Hugues Robert qualifie cet épisode de nouvelle manifestation de « La Machine à Empêcher » :
    une limite institutionnelle ou technique qui transforme une démarche administrativement simple en friction
    supplémentaire. Cette qualification est enregistrée comme interprétation du principal ; le fait vérifiable
    reste le rejet SMTP 552 5.3.4 pour dépassement de taille.
  adaptation: >
    Réduire la friction plutôt que débattre de la limite : compression du seul PDF volumineux, suppression
    de l'annexe documentaire binaire au profit de son URL officielle, conservation du même canal et de la trace.

public_summary: >
  Jean Hugues Noël Robert, candidat sous l'appellation électorale Baron Mariani, se présente
  à l'élection sénatoriale du 27 septembre 2026 en Haute-Corse avec Laurence Marie Vernerey,
  appellation électorale Marie-Louise d'Angelis, comme remplaçante. L'étiquette déclarée est
  « Le Petit Parti - A Voce » et Marguerite Ghionga est désignée mandataire financier. Une première
  pré-transmission par courriel a été tentée le 10 septembre à 17:01, mais le serveur de la préfecture
  l'a refusée pour dépassement de taille (552 5.3.4). Une version allégée du dossier, toujours entièrement
  dématérialisée, a été préparée le même jour avec demande de rendez-vous pour la matinée du 11 septembre.
  La démarche est associée à une mobilité décarbonée : train Corte–Bastia et retour en covoiturage.

current_status:
  label: "Première transmission rejetée pour taille — retransmission allégée prête en brouillon"
  interpretation: >
    La préfecture n'a pas reçu le premier dossier. Un nouveau brouillon dans le même fil réduit la taille
    totale à environ 3,2 MiB de pièces jointes brutes, remplace le guide DITP par son lien officiel et conserve
    les huit pièces du dossier de candidature. Envoi non encore effectué au moment de cette mise à jour.

