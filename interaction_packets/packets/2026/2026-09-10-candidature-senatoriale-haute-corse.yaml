public_summary: >
  Jean Hugues Noël Robert, candidat sous l'appellation électorale Baron Mariani, se présente
  à l'élection sénatoriale du 27 septembre 2026 en Haute-Corse avec Laurence Marie Vernerey,
  appellation électorale Marie-Louise d'Angelis, comme remplaçante. L'étiquette déclarée est
  « Le Petit Parti - A Voce » et Marguerite Ghionga est désignée mandataire financier. Le dossier
  complet a été pré-transmis par courriel à la préfecture le 10 septembre à 17:01, avec demande
  de rendez-vous pour la matinée du 11 septembre. La démarche est volontairement dématérialisée
  et associée à une mobilité décarbonée : train Corte–Bastia et retour en covoiturage.

