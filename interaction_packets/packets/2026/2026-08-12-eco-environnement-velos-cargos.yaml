contexte: >
  Dossier relatif à quatre vélos cargos électriques commandés suivant devis ELEC-VC4B-002669,
  signé électroniquement le 7 septembre 2025. Après plusieurs demandes documentaires destinées
  à finaliser le dossier, C.O.R.S.I.C.A. a transmis le numéro de téléphone demandé, une attestation
  sur l’honneur signée puis une version portant également le cachet associatif. Eco Environnement
  a confirmé la réception de cette dernière pièce le 14 août 2026 sans répondre aux questions
  réitérées sur les modalités ou étapes de livraison.

