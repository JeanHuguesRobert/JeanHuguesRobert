current_status:
  label: "Dossier documentaire satisfait — livraison concrète demandée le 15/08"
  interpretation: >
    Eco Environnement a confirmé le 14 août la réception de la dernière pièce documentaire,
    sans répondre aux questions de livraison. Le 15 août, C.O.R.S.I.C.A. a demandé explicitement
