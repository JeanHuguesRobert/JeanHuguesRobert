process_observation:
  type: "revealing_observation"
  label: "Asymétrie de traitement / Machine à Empêcher"
  note: >
    Les demandes documentaires d’Eco Environnement ont suscité des réponses rapides et ont été
    successivement satisfaites par C.O.R.S.I.C.A. En revanche, la confirmation du 14 août ne
    répond pas aux questions déjà formulées sur la livraison. Cette asymétrie est consignée comme
    observation factuelle à suivre, sans préjuger de sa cause. Le stabilisateur choisi consiste
    à réduire la friction côté bénéficiaire, conserver le canal écrit, offrir une flexibilité
    logistique et demander une action concrète plutôt qu’une information générale.

resume_public: >
  Entre les 12 et 15 août 2026, C.O.R.S.I.C.A. a satisfait les demandes documentaires formulées
  pour finaliser la livraison de quatre vélos cargos électriques. Eco Environnement a confirmé
  réception de la dernière pièce le 14 août sans préciser les modalités de livraison. Le 15 août,
  l’association a demandé la première possibilité concrète de livraison, en indiquant sa capacité
  à s’adapter à un préavis court et aux contraintes logistiques en Corse, notamment en vue de la
  rentrée universitaire à Corte.
