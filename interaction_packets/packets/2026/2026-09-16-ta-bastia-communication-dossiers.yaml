resume_public: >
  Après les demandes des 16, 17 et 18 septembre, le greffe a invité le 21/09 à retirer le
  jugement et à revenir vers lui si des questions subsistaient. Le jugement a été retiré et
  lu le 25/09 : il fixe notamment à 15:49 l'enregistrement de la note en délibéré mais laisse
  six points matériels ouverts. Une relance publique dans sa substance a été envoyée le
  25/09 à 16:50:46 CEST, dans le fil existant et avec Laurence Ceccaldi et Maguy en copie.
  Elle vise uniquement l'état documentaire du dossier et mentionne l'article L.303 du code
  électoral pour expliquer, sans mise en demeure, l'intérêt de cette clarification.

