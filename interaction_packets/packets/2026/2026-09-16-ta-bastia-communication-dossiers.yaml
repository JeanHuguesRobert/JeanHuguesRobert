current_status:
  label: "Jugement reçu et lu ; six points matériels relancés le 25/09 dans le fil existant — réponse attendue"
  interpretation: >
    Le greffe a fourni plusieurs éléments utiles, dont la confirmation que la note en délibéré
    avait été prise en compte avant décision. Le jugement reçu le 25/09 fixe son enregistrement
    à 15:49 mais ne résout pas six questions documentaires. Une relance ciblée a donc été envoyée
    le 25/09 dans le fil existant, sans demande d'appréciation du jugement et avec référence
    mesurée à l'article L.303 du code électoral pour expliquer l'intérêt de la clarification.

