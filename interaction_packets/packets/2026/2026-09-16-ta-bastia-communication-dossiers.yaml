  Deux dossiers sont ouverts au Tribunal administratif de Bastia sous les numéros
  2601714-1 et 2601715-1, en lien avec la candidature sénatoriale. Une note en délibéré
  a été envoyée le 14 septembre 2026 à 15:48 (fait déjà mentionné dans mail_trace).

