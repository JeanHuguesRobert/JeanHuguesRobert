  Demande strictement matérielle portant notamment sur : la communication des décisions ;
  leurs date et heure de mise à disposition ; l'enregistrement de la note en délibéré
  envoyée le 14/09 à 15:48 ; l'état chronologique des pièces versées aux deux dossiers.

