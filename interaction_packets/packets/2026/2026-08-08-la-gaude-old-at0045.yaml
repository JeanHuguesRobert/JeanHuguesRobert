  les prescriptions applicables tout en demandant une détermination précise du périmètre
  et des modalités techniques, ainsi qu'un interlocuteur compétent et, si utile, une visite
  sur place. Elle demande également que le courriel devienne le mode de correspondance
  privilégié, avec copie électronique des éventuelles notifications postales. Réponse et
  accusé de réception attendus.

