contexte: >
  À la veille du scrutin sénatorial du 27 septembre 2026, les sources publiques consultées
  permettaient d'établir le mécanisme général de dépouillement et de proclamation, mais pas
  le lieu précis du collège électoral de Haute-Corse, les conditions d'accès à la proclamation
  ni le canal institutionnel exact permettant d'observer au plus près l'heure de proclamation.

demande: >
  Demande pratique portant sur quatre points : lieu exact du bureau du collège électoral ;
  confirmation que la proclamation des résultats est faite dans cette même salle ; accès
  éventuel du public ou de la presse, ou existence d'un point d'information distinct après
  dépouillement ; canal officiel de publication immédiate après proclamation. Le message
  précise que l'objectif est de distinguer l'heure de la proclamation officielle de celle
  d'une publication ultérieure en ligne.

