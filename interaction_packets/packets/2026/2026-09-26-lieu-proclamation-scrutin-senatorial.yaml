resume_public: >
  Le 26 septembre 2026 à 10:58:26 CEST, Jean Hugues Noël Robert a demandé au Bureau des
  élections de la préfecture de Haute-Corse de préciser le lieu exact du collège électoral,
  le lieu de proclamation des résultats, les conditions d'accès du public ou de la presse
  et le canal officiel de publication immédiate. Laurence Ceccaldi, Maguy et Adrien Vidal
  étaient en copie. La demande vise à pouvoir distinguer et horodater correctement demain
  l'acte de proclamation et sa publication ultérieure.

