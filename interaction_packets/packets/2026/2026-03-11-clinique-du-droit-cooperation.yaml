current_status:
  label: "Deux courriels envoyés, rappel oral effectué ; aucune réponse écrite détectée au 2026-07-27"
  details:
    - "La proposition de coopération reste ouverte."
    - "Aucune réponse écrite à cette proposition n'a été détectée dans Gmail au 2026-07-27."
    - "Le cas est suivi comme une difficulté pratique de coopération, non comme une preuve d'intention institutionnelle."

interpretation:
  level: "personal-observation, cautious"
  text: >
    L'Université de Corse présente publiquement une stratégie « Sciences Avec et
    Pour la Société », un dialogue renforcé entre sciences, recherche et société,
    ainsi qu'une approche inclusive et participative associant scientifiques et
    citoyens. Dans ce cas précis, Jean Hugues Robert constate qu'une proposition
    de coopération documentée n'a reçu aucune réponse écrite après deux courriels
    et un rappel oral. Ce décalage interroge la mise en pratique de ces orientations
    pour des initiatives externes à l'Université. Il ne permet pas, à lui seul,
    d'attribuer une intention à l'institution ni de conclure sur l'ensemble de ses
    pratiques.

