    summary: >
      Jean Hugues Noël Robert rencontre Anne-Marie Luciani dans les locaux de
      l'Université de Corse, ainsi qu'une partie des étudiants participant à la
      Clinique du droit. Un projet de coopération est évoqué.

  - date: "2026-04-08"
    time: "08:14"
    direction: "outbound"
    channel: "email"
    event: "Proposition de coopération"
    summary: >
      Courriel adressé à Anne-Marie Luciani pour proposer une coopération autour
      d'un testament cognitif, de la préfiguration du Fonds de dotation Barons
      Mariani et du statut juridique d'un jumeau numérique. L'email est conservé
      comme source privée ; une synthèse de son objet est publiée ici.
    status: "sent"

  - date: "2026-04-30"
    direction: "in-person"
    channel: "rencontre"
    event: "Rappel oral"
    summary: >
      Rappel oral de l'email et de la proposition à l'issue du colloque EMRJ
      « Les métamorphoses récentes du droit privé » à Corte. Aucun suivi concret
      n'est constaté à la suite de cet échange.

  - date: "2026-07-27"
    time: "11:22"
    direction: "outbound"
    channel: "email"
    event: "Mise à jour et relance"
    summary: >
      Envoi d'un message présentant le document public « La personne numérique
      mandatée » et proposant de délimiter une première question de recherche.
      Institut Mariani mis en copie pour archive.
    status: "sent"

