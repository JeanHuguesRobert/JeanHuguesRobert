current_status:
  label: "Questions non résolues ; demande formelle CRPA/RGPD envoyée le 25/09 — réponse et conservation des traces attendues"
  interpretation: >
    La réponse préfectorale du 16/09 ne résout aucune des trois vérifications factuelles.
    Après les reformulations des 17 et 18 septembre, une demande formelle a été envoyée le
    25/09 afin d'obtenir les documents et données existants plutôt qu'une nouvelle appréciation.
    La démarche distingue CRPA et RGPD, demande la conservation des journaux techniques encore
    disponibles et explicite sans caractère comminatoire les voies CADA/CNIL susceptibles de
    devenir pertinentes en cas de difficulté persistante.

