resume_public: >
  Les trois vérifications factuelles relatives au courriel du 11/09 à 17:57:55 restent
  sans réponse substantielle. Le 25/09 à 16:59:13 CEST, une demande formelle publique dans
  sa substance a été adressée à la préfète, avec le Bureau des élections, Adrien Vidal,
  Laurence Ceccaldi et Maguy en copie. Elle vise les documents et données existants, distingue
  le régime CRPA du droit d'accès de l'article 15 RGPD, demande la conservation des journaux
  techniques encore disponibles et mentionne sobrement la CADA et la CNIL comme voies
  éventuelles si l'accès restait impossible. Les données techniques ou personnelles qui
  seraient communiquées feront l'objet d'une minimisation avant publication.

