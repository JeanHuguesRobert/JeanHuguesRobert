contexte: >
  Le 11 septembre 2026 à 17:57:55, un courriel vidéo a été adressé dans le cadre du dossier
  de candidature / contentieux. Une saisine du TA est mentionnée comme enregistrée à 18:16
  le même jour (selon mail_trace). Un fil du 15/09 existe déjà ; la présente interaction
  est une relance (Relance = 1 dans le registre).

demande: >
  Trois vérifications factuelles, avec proposition explicite d'une réponse brève oui/non :
  (1) réception avant 18:00 du courriel de 17:57:55 ;
  (2) présence de cet élément dans la saisine du TA enregistrée à 18:16 ;
  (3) à défaut, éventuelle transmission ultérieure au TA avant qu'il statue.

