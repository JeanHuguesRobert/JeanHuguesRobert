current_status:
  label: "Demande préventive envoyée ; réponse opérationnelle attendue avant le scrutin"
  interpretation: >
    Le probe cherche à prévenir un éventuel conflit de support avant qu'il ne devienne
    bloquant. Les accusés du 25/09 établissent que la préfecture qualifie déjà certaines
    démarches reçues par courriel de « saisine par voie électronique ». La présente demande
    ne présume pas que cette qualification suffise juridiquement au titre de l'article 34 ;
    elle sollicite précisément une confirmation ou, à défaut, une instruction matérielle
    explicite pour le dimanche 27 septembre.

