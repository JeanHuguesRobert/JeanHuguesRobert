resume_public: >
  Le 26 septembre 2026 à 10:44:22 CEST, Jean Hugues Noël Robert a demandé au Bureau des
  élections de la préfecture de Haute-Corse de confirmer qu'une éventuelle requête écrite
  et signée au titre de l'article 34 de l'ordonnance n° 58-1067, transmise en PDF, pourrait
  être reçue, horodatée puis transmise électroniquement au secrétaire général du Conseil
  constitutionnel. Laurence Ceccaldi, Maguy et Adrien Vidal étaient en copie. La démarche
  se place explicitement dans le prolongement de deux accusés du 25 septembre qualifiant
  une précédente démarche de « saisine par voie électronique ». Elle vise à clarifier le
  canal avant le scrutin et à éviter une rupture inutile de la chaîne électronique.

