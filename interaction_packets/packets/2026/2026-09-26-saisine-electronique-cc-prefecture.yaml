contexte: >
  Le 25 septembre 2026, la préfecture et le Bureau des élections ont chacun accusé réception
  d'une précédente démarche en employant explicitement la formule de « saisine par voie
  électronique ». La présente interaction cherche, avant le scrutin du 27 septembre, à
  clarifier la modalité matérielle d'une éventuelle requête postérieure au scrutin adressée
  au représentant de l'État sur le fondement de l'article 34 de l'ordonnance n° 58-1067.

demande: >
  Confirmation qu'une requête écrite et signée, transmise en PDF à l'adresse électronique
  officielle du Bureau des élections, pourra être reçue, horodatée et transmise par voie
  électronique au secrétaire général du Conseil constitutionnel. À défaut, demande de la
  modalité exacte à utiliser le dimanche 27 septembre afin d'éviter une rupture inutile
  de la chaîne électronique.

