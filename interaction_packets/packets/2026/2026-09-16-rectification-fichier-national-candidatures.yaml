contexte: >
  La candidature Haute-Corse n°3 figure au fichier national des candidatures. Avant la
  demande de rectification, la ligne publiée conservait les graphies
  `MARIANI / Baron / DIV / D'ANGELIS / Maire-Louise`. Ces graphies divergent des CERFA
  et des usages typographiques invoqués par le candidat (notamment `Marie-Louise`,
  `Mariani`, `d'Angelis`).

demande: >
  Rectification limitée des graphies publiées pour la candidature Haute-Corse n°3 :
  `Maire-Louise` → `Marie-Louise` ; `MARIANI` → `Mariani` ; `D'ANGELIS` → `d'Angelis`,
  conformément aux graphies figurant sur les CERFA et aux usages typographiques invoqués.

